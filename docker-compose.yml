# =============================================================================
# Alexandria Server - Docker Compose Configuration
# =============================================================================
#
# Quick Start:
#   1. Copy .env.example to .env and configure
#   2. Run: docker compose up -d
#   3. Access: http://localhost:4000/health
#
# This file runs the published image. To build from the source instead, add
# docker-compose.build.yml:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# =============================================================================

services:
  alexandria-server:
    image: ghcr.io/stoutc24/alexandria-server:latest
    container_name: alexandria-server
    restart: unless-stopped

    ports:
      - "${PORT:-4000}:4000"

    volumes:
      # Persistent data storage. To keep the data in a folder instead, do
      # not edit this file: put the change in docker-compose.override.yml
      # (README, "Changing the compose file"), so an update never undoes it.
      - alexandria-data:/data

    environment:
      # Server configuration
      - PORT=4000
      - DB_PATH=/data/alexandria.db

      # REQUIRED — the server refuses to start without it.
      # Generate with:  openssl rand -hex 32
      - ALEXANDRIA_API_TOKEN=${ALEXANDRIA_API_TOKEN:?set ALEXANDRIA_API_TOKEN in .env}

      # Discovery label. Without it the container id is used, which
      # changes on every recreate and makes this look like a new machine.
      - ALEXANDRIA_SERVER_NAME=${ALEXANDRIA_SERVER_NAME:-Alexandria Companion}

      # Optional: the https address the server is reached at from outside
      # (behind a reverse proxy). Empty means unset.
      - ALEXANDRIA_PUBLIC_URL=${ALEXANDRIA_PUBLIC_URL:-}

      # Optional: the address your reverse proxy connects from, so the
      # sign-in and linking limits count each visitor separately. Empty
      # means unset.
      - ALEXANDRIA_TRUSTED_PROXIES=${ALEXANDRIA_TRUSTED_PROXIES:-}

      # Optional: lets Alexandria accounts store each person's service logins
      # (sealed). Generate with:  openssl rand -base64 32
      # Keep it out of backups of the data volume — that is what protects
      # them. Empty means unset: accounts still work, without stored logins.
      # See docs/ACCOUNTS.md.
      - ALEXANDRIA_SECRETS_KEY=${ALEXANDRIA_SECRETS_KEY:-}

      # Optional: "off" stops the server keeping picked Plex people's saved
      # addresses current when your home's internet address changes (it asks
      # plex.tv for its own public address every 15 minutes, only while
      # someone is picked from a Plex server). Empty means on.
      - ALEXANDRIA_PLEX_ADDRESS_WATCH=${ALEXANDRIA_PLEX_ADDRESS_WATCH:-}

      # Timezone
      - TZ=${TZ:-UTC}

    # Resource limits (adjust based on your server)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M

    # Health monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alexandria-data:
    driver: local

# =============================================================================
# Network configuration (optional - useful with reverse proxy)
# =============================================================================
# networks:
#   default:
#     name: alexandria-network
#   proxy:
#     external: true
