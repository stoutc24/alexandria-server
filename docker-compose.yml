version: '3.8'

# =============================================================================
# Alexandria Server - Docker Compose Configuration
# =============================================================================
#
# Quick Start:
#   1. Copy .env.example to .env and configure
#   2. Run: docker-compose up -d
#   3. Access: http://localhost:4000/health
#
# =============================================================================

services:
  alexandria-server:
    image: ghcr.io/stoutc24/alexandria-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alexandria-server
    restart: unless-stopped

    ports:
      - "${PORT:-4000}:4000"

    volumes:
      # Persistent data storage
      - alexandria-data:/data
      # Optional: bind mount for easier backup access
      # - ./data:/data

    environment:
      # Server configuration
      - PORT=4000
      - DB_PATH=/data/alexandria.db

      # REQUIRED — the server refuses to start without it.
      # Generate with:  openssl rand -hex 32
      - ALEXANDRIA_API_TOKEN=${ALEXANDRIA_API_TOKEN:?set ALEXANDRIA_API_TOKEN in .env}

      # Discovery label. Without it the container id is used, which
      # changes on every recreate and makes this look like a new machine.
      - ALEXANDRIA_SERVER_NAME=${ALEXANDRIA_SERVER_NAME:-Alexandria Companion}

      # Timezone
      - TZ=${TZ:-UTC}

      # Trailers (optional; the image ships yt-dlp, ffmpeg and deno).
      # Downloaded MP4s are cached here, on the data volume, up to
      # TRAILER_CACHE_MB — the least recently played go first.
      - TRAILER_CACHE_DIR=/data/trailers
      # - TRAILER_CACHE_MB=4096

    # Resource limits (adjust based on your server)
    #
    # Memory covers the Go server AND a trailer download's children:
    # yt-dlp (a bundled Python), deno and ffmpeg each run as a separate
    # process while a trailer is being fetched, and the server allows two
    # at once. 256M was right for the server alone; it is not enough for
    # that, and an OOM kill mid-download takes the whole container down.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 64M

    # Health monitoring (curl: the Debian runtime image has no wget)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alexandria-data:
    driver: local

# =============================================================================
# Network configuration (optional - useful with reverse proxy)
# =============================================================================
# networks:
#   default:
#     name: alexandria-network
#   proxy:
#     external: true
