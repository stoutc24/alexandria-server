name: Build and Push Docker Image

# Supply-chain rules for this workflow (it publishes the image every
# household pulls as :latest):
#  - Every third-party action is pinned to a full commit SHA, with its
#    version in a comment. A tag can be moved to other code; a SHA cannot.
#    Dependabot (.github/dependabot.yml) proposes updates.
#  - Nothing has permissions by default; each job asks for what it needs.
#  - Pull requests from forks are never built: outside contributions are
#    not accepted (CONTRIBUTING.md) and their code never runs here. Same-
#    repository pull requests (Dependabot's) are built, never pushed.
#  - workflow_dispatch: the owner can rebuild and republish main by hand
#    (Actions › Run workflow), e.g. to pick up patched base images without
#    a code change. Only people with write access can start it.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Nothing is built or published unless the code passes go vet, every
  # test, and govulncheck (a known flaw the code can reach fails the run).
  # They run in the Dockerfile's own pinned builder image, read from its
  # FROM line, so the checked Go is exactly the Go the image ships and the
  # two can never drift apart.
  verify:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vet, test and scan with the image's Go
        run: |
          builder="$(sed -n 's/^FROM \(golang:[^ ]*\) AS builder$/\1/p' Dockerfile)"
          test -n "$builder" || { echo "no builder image in the Dockerfile" >&2; exit 1; }
          echo "Checking with $builder"
          docker run --rm -e GOFLAGS=-buildvcs=false -v "$PWD:/src" -w /src "$builder" sh -ec '
            go version
            go vet ./...
            go test -count=1 ./...
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          '

  build:
    needs: verify
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      packages: read

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test container starts
        run: |
          docker run -d --name test-alexandria \
            -e ALEXANDRIA_API_TOKEN=ci-smoke-test-token-not-a-secret \
            -p 4000:4000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          sleep 5

          # Health check
          curl -f http://localhost:4000/health || exit 1

          docker stop test-alexandria
          docker rm test-alexandria
